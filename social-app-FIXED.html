<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Vactra Flow - Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        .feed-container { max-width: 500px; margin: 0 auto; }
        .video-card { position: relative; height: 80vh; width: 100%; background: #111; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; border-radius: 10px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        nav { background: #000; border-top: 1px solid #222; position: fixed; bottom: 0; width: 100%; height: 60px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

    <!-- YouTube Style Top Search Bar -->
    <header class="p-3 bg-black sticky top-0 z-50 flex items-center gap-3 border-b border-gray-800">
        <h1 class="text-xl font-bold text-red-600 tracking-wider">VACTRA</h1>
        <div class="relative w-full">
            <input type="text" id="searchInput" onkeyup="searchVideos()" placeholder="Search videos (e.g., Cat, Nature)..." class="w-full py-2 pl-4 pr-10 rounded-full bg-gray-900 border border-gray-700 text-white text-sm focus:outline-none focus:border-red-500">
            <i class="fa-solid fa-search absolute right-3 top-3 text-gray-400 text-sm"></i>
        </div>
    </header>

    <!-- Main Feed -->
    <main class="feed-container p-2" id="videoFeed">
        
        <!-- Video Card 1 -->
        <div class="video-card" data-title="Cute Cat Drinking Juice">
            <video class="w-full h-full object-cover" controls>
                <source src="vactra-video.mp4" type="video/mp4">
            </video>
            <div class="absolute bottom-4 left-4">
                <p class="font-bold text-sm">@Asheesh_Kumar_</p>
                <p class="text-xs text-gray-300">Cute Cat Drinking Juice 🐱</p>
            </div>
        </div>

        <!-- Video Card 2 -->
        <div class="video-card" data-title="Nature Moon River Night">
            <video class="w-full h-full object-cover" controls>
                <source src="vactra-video.mp4" type="video/mp4">
            </video>
            <div class="absolute bottom-4 left-4">
                <p class="font-bold text-sm">@Asheesh_Kumar_</p>
                <p class="text-xs text-gray-300">Beautiful Night Moon 🌙</p>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav>
        <a href="social-app-FIXED.html" class="text-center text-red-500"><i class="fa-solid fa-house text-xl"></i><p class="text-[10px]">Home</p></a>
        <a href="studio.html" class="text-center text-gray-400"><i class="fa-solid fa-plus-circle text-xl text-pink-500"></i><p class="text-[10px]">Create</p></a>
        <a href="#" class="text-center text-gray-400"><i class="fa-solid fa-user text-xl"></i><p class="text-[10px]">You</p></a>
    </nav>

    <script>
        // YouTube Style Search Logic
        function searchVideos() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('video-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title').toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "flex"; // Match hone par dikhao
                } else {
                    cards[i].style.display = "none";  // Match na ho toh chhupa do
                }
            }
        }
    </script>
</body>
</html>
