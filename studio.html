<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Vactra Pro Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen">

    <!-- Camera Preview -->
    <div class="relative w-full h-[70vh]">
        <video id="preview" class="w-full h-full object-cover" autoplay playsinline></video>
    </div>

    <!-- Toolbar -->
    <div class="grid grid-cols-4 gap-2 p-4">
        <button onclick="setFilter('sepia(1)')" class="bg-amber-700 p-2 rounded">Vintage</button>
        <button onclick="setFilter('grayscale(1)')" class="bg-gray-500 p-2 rounded">B&W</button>
        <button onclick="generateAI()" class="bg-purple-700 p-2 rounded">✨ AI</button>
        <button onclick="document.getElementById('music-input').click()" class="bg-green-700 p-2 rounded">🎵</button>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-center gap-6 p-4">
        <button id="rec-btn" class="w-16 h-16 bg-red-600 rounded-full border-4"></button>
        <button onclick="downloadVideo()" class="bg-blue-600 px-6 py-2 rounded">Download</button>
    </div>

    <script>
        const video = document.getElementById('preview');
        let mediaRecorder;
        let chunks = [];

        // Camera Access
        navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(s => {
            video.srcObject = s;
            mediaRecorder = new MediaRecorder(s);
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
        });

        // Record & Download Logic
        document.getElementById('rec-btn').onclick = () => {
            chunks = [];
            mediaRecorder.start();
            alert("Recording Started!");
        };

        function downloadVideo() {
            mediaRecorder.stop();
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, {type: 'video/mp4'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'vactra-video.mp4';
                a.click();
            };
        }

        function setFilter(f) { video.style.filter = f; }
        function generateAI() { alert("AI feature processing..."); }
    </script>
</body>
</html>
